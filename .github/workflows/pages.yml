# GitHub Pages: istemciyi tek oyunculu (tarayıcı içi) modda derler ve gh-pages dalına yayınlar.
# Site adresi: https://<kullanıcı>.github.io/<depo>/
name: GitHub Pages

on:
  push:
    branches: [main, master, ccr-645808ef-7lu9c1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler
        run: npm test

      - name: Pages derlemesi
        run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Statik site ayarları
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: gh-pages dalına yayınla
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Yayın: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
